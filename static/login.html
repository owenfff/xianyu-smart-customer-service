<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 万达旅游客服</title>
  <link rel="icon" type="image/png" href="/static/logo.png">
  <link rel="stylesheet" href="/static/lib/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/static/lib/bootstrap-icons/bootstrap-icons.css">
  <style>
    :root {
      --primary-color: #1698c8;
      --primary-hover: #0f7fa9;
      --secondary-color: #6b8592;
      --success-color: #16a085;
      --danger-color: #d95c68;
      --ink-color: #16384a;
      --muted-color: #6a8490;
      --border-color: #d8e8ee;
      --surface-soft: #f5fbfd;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at 12% 12%, rgba(91, 201, 235, 0.16), transparent 28%),
        radial-gradient(circle at 88% 88%, rgba(42, 184, 166, 0.10), transparent 26%),
        linear-gradient(145deg, #eaf7ff 0%, #f7fcfd 56%, #eefaf8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: var(--ink-color);
    }
    
    .login-container {
      background: #ffffff;
      border-radius: 22px;
      border: 1px solid rgba(188, 220, 230, 0.85);
      box-shadow: 0 24px 60px rgba(35, 105, 127, 0.14), 0 4px 14px rgba(35, 105, 127, 0.06);
      overflow: hidden;
      width: 100%;
      max-width: 430px;
    }
    
    .login-header {
      background: linear-gradient(180deg, #f0fbff 0%, #ffffff 100%);
      color: var(--ink-color);
      padding: 30px 32px 22px;
      text-align: center;
      border-top: 5px solid #4bbde7;
    }
    
    .login-header h2 {
      margin: 0;
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    
    .login-header p {
      margin: 7px 0 0;
      color: var(--muted-color);
      font-size: 0.95rem;
    }
    
    .login-body {
      padding: 24px 32px 30px;
      background: #ffffff;
    }

    .login-tabs {
      padding: 4px;
      margin-bottom: 22px !important;
      background: var(--surface-soft);
      border: 1px solid var(--border-color);
      border-radius: 12px;
    }

    .login-tabs .btn-group {
      display: flex;
      gap: 3px;
    }

    .login-tabs .btn {
      flex: 1 1 0;
      min-width: 0;
      border: 0 !important;
      border-radius: 9px !important;
      padding: 10px 6px;
      color: var(--muted-color);
      background: transparent;
      font-size: 0.88rem;
      white-space: nowrap;
    }

    .login-tabs .btn:hover,
    .login-tabs .btn:focus-visible {
      color: var(--primary-hover);
      background: #e8f6fb;
    }

    .login-tabs .btn-check:checked + .btn {
      color: #ffffff;
      background: var(--primary-color);
      box-shadow: 0 5px 12px rgba(22, 152, 200, 0.22);
    }
    
    .form-control {
      border-radius: 11px;
      border: 1px solid var(--border-color);
      background: #fbfdfe;
      padding: 12px 15px;
      font-size: 16px;
      color: var(--ink-color);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }
    
    .form-control:focus {
      border-color: var(--primary-color);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(22, 152, 200, 0.13);
    }

    .form-control::placeholder {
      color: #8ca1aa;
    }
    
    .btn-login {
      background: var(--primary-color);
      border: none;
      border-radius: 11px;
      padding: 13px;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      letter-spacing: 0.04em;
      box-shadow: 0 8px 18px rgba(22, 152, 200, 0.18);
      transition: background-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }
    
    .btn-login:hover {
      background: var(--primary-hover);
      box-shadow: 0 10px 22px rgba(15, 127, 169, 0.22);
      transform: translateY(-1px);
    }
    
    .input-group {
      position: relative;
      margin-bottom: 14px;
    }
    
    .input-group i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #6d8c99;
      z-index: 10;
    }
    
    .input-group .form-control {
      padding-left: 45px;
    }
    
    .alert {
      border-radius: 11px;
      border: 1px solid rgba(217, 92, 104, 0.24);
    }

    .form-label {
      color: var(--ink-color);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .form-text {
      color: var(--muted-color) !important;
      font-size: 0.78rem;
    }

    #registerSection {
      margin-top: 18px !important;
    }

    #registerSection a {
      color: var(--primary-hover);
      font-weight: 600;
    }

    #defaultLoginInfo {
      margin-top: 22px !important;
      padding: 14px 16px !important;
      background: var(--surface-soft) !important;
      border: 1px solid var(--border-color);
      border-radius: 12px !important;
    }

    #defaultLoginInfo code {
      color: var(--primary-hover);
      background: #ffffff !important;
      border: 1px solid #d9edf3;
    }

    #defaultLoginInfo .btn-outline-primary {
      color: var(--primary-hover);
      border-color: #9fd2e2;
      border-radius: 8px;
    }

    #defaultLoginInfo .btn-outline-primary:hover {
      color: #ffffff;
      background: var(--primary-color);
      border-color: var(--primary-color);
    }
    
    .loading {
      display: none;
    }
    
    .loading.show {
      display: inline-block;
    }

    .login-brand-logo {
      display: block;
      width: 238px;
      height: 76px;
      max-height: 76px;
      object-fit: contain;
      object-position: center;
      border-radius: 0;
      background: transparent;
      margin-left: auto;
      margin-right: auto;
      margin-bottom: 16px !important;
      filter: drop-shadow(0 5px 10px rgba(38, 116, 139, 0.08));
    }

    @media (max-width: 600px) {
      body {
        align-items: flex-start;
        padding: 16px 10px;
      }

      .login-header {
        padding: 26px 22px 20px;
      }

      .login-body {
        padding: 20px 22px 24px;
      }

      .login-tabs .btn {
        font-size: clamp(0.72rem, 3.1vw, 0.82rem);
        padding-left: 3px;
        padding-right: 3px;
        white-space: normal;
        line-height: 1.2;
        min-height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <img src="/static/logo.png" alt="万达旅游 Logo" class="mb-3 brand-logo login-brand-logo">
      <h2>欢迎登录</h2>
      <p>万达旅游客服</p>
    </div>
    
    <div class="login-body">
      <!-- 登录方式选择 -->
      <div class="login-tabs mb-4">
        <div class="btn-group w-100" role="group">
          <input type="radio" class="btn-check" name="loginType" id="usernameLogin" value="username" checked>
          <label class="btn btn-outline-primary" for="usernameLogin">用户名/密码</label>

          <input type="radio" class="btn-check" name="loginType" id="emailPasswordLogin" value="email-password">
          <label class="btn btn-outline-primary" for="emailPasswordLogin">邮箱/密码</label>

          <input type="radio" class="btn-check" name="loginType" id="emailCodeLogin" value="email-code">
          <label class="btn btn-outline-primary" for="emailCodeLogin">邮箱/验证码</label>
        </div>
      </div>

      <form id="loginForm">
        <!-- 用户名/密码登录 -->
        <div id="usernameLoginForm" class="login-form-section">
          <div class="input-group">
            <i class="bi bi-person-fill"></i>
            <input type="text" class="form-control" id="username" placeholder="请输入用户名">
          </div>

          <div class="input-group">
            <i class="bi bi-lock-fill"></i>
            <input type="password" class="form-control" id="password" placeholder="请输入密码">
          </div>
        </div>

        <!-- 邮箱/密码登录 -->
        <div id="emailPasswordLoginForm" class="login-form-section" style="display: none;">
          <div class="input-group">
            <i class="bi bi-envelope-fill"></i>
            <input type="email" class="form-control" id="emailForPassword" placeholder="请输入邮箱地址">
          </div>

          <div class="input-group">
            <i class="bi bi-lock-fill"></i>
            <input type="password" class="form-control" id="emailPassword" placeholder="请输入密码">
          </div>
        </div>

        <!-- 邮箱/验证码登录 -->
        <div id="emailCodeLoginForm" class="login-form-section" style="display: none;">
          <div class="input-group">
            <i class="bi bi-envelope-fill"></i>
            <input type="email" class="form-control" id="emailForCode" placeholder="请输入邮箱地址">
          </div>

          <!-- 邮箱验证码 -->
          <div class="input-group">
            <input type="text" class="form-control" id="verificationCode" placeholder="输入6位验证码" maxlength="6">
            <button type="button" class="btn btn-outline-secondary" id="sendCodeBtn" onclick="sendVerificationCode()" disabled>
              发送验证码
            </button>
          </div>
          <div class="form-text mb-3">
            <span id="codeStatus">请输入邮箱地址后发送验证码</span>
          </div>
        </div>

        <div id="errorAlert" class="alert alert-danger d-none" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>
          <span id="errorMessage"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-login">
          <span class="loading spinner-border spinner-border-sm me-2" role="status"></span>
          <span id="loginText">登录</span>
        </button>
      </form>

      <!-- 注册链接 -->
      <div id="registerSection" class="text-center mt-3">
        <span class="text-muted">还没有账号？</span>
        <a href="/register.html" class="text-decoration-none">
          <i class="bi bi-person-plus me-1"></i>立即注册
        </a>
      </div>

      <!-- 默认账号提示 -->
      <div id="defaultLoginInfo" class="mt-4 p-3 bg-light rounded-3">
        <div class="text-center">
          <small class="text-muted">
            <i class="bi bi-info-circle me-1"></i>
            默认登录账号
          </small>
        </div>
        <div class="mt-2">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <small class="text-muted">用户名：</small>
            <code class="bg-white px-2 py-1 rounded">admin</code>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <small class="text-muted">密码：</small>
            <code class="bg-white px-2 py-1 rounded">admin123</code>
          </div>
        </div>
        <div class="text-center mt-2">
          <button type="button" class="btn btn-sm btn-outline-primary" onclick="fillDefaultCredentials()">
            <i class="bi bi-arrow-down-circle me-1"></i>
            使用默认账号
          </button>
        </div>
      </div>

    </div>
  </div>

  <script src="/static/lib/bootstrap/bootstrap.bundle.min.js"></script>
  <script>
    const loginForm = document.getElementById('loginForm');
    const errorAlert = document.getElementById('errorAlert');
    const errorMessage = document.getElementById('errorMessage');
    const loading = document.querySelector('.loading');
    const loginText = document.getElementById('loginText');

    function showError(message) {
      errorMessage.textContent = message;
      errorAlert.classList.remove('d-none');
    }
    
    function hideError() {
      errorAlert.classList.add('d-none');
    }
    
    function setLoading(isLoading) {
      if (isLoading) {
        loading.classList.add('show');
        loginText.textContent = '登录中...';
        loginForm.querySelector('button').disabled = true;
      } else {
        loading.classList.remove('show');
        loginText.textContent = '登录';
        loginForm.querySelector('button').disabled = false;
      }
    }
    
    // 填充默认登录凭据
    function fillDefaultCredentials() {
      document.getElementById('username').value = 'admin';
      document.getElementById('password').value = 'admin123';
      hideError();

      // 添加一个小动画效果
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');

      usernameInput.style.backgroundColor = '#e3f2fd';
      passwordInput.style.backgroundColor = '#e3f2fd';

      setTimeout(() => {
        usernameInput.style.backgroundColor = '';
        passwordInput.style.backgroundColor = '';
      }, 1000);
    }
    
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      setLoading(true);

      const loginType = document.querySelector('input[name="loginType"]:checked').value;
      let loginData = {};

      try {
        if (loginType === 'username') {
          const username = document.getElementById('username').value;
          const password = document.getElementById('password').value;

          if (!username || !password) {
            showError('请输入用户名和密码');
            return;
          }

          loginData = { username, password };
          
        } else if (loginType === 'email-password') {
          const email = document.getElementById('emailForPassword').value;
          const password = document.getElementById('emailPassword').value;

          if (!email || !password) {
            showError('请输入邮箱和密码');
            return;
          }

          if (!validateEmail(email)) {
            showError('请输入有效的邮箱地址');
            return;
          }

          loginData = { email, password };
          
        } else if (loginType === 'email-code') {
          const email = document.getElementById('emailForCode').value;
          const verificationCode = document.getElementById('verificationCode').value;

          if (!email) {
            showError('请输入邮箱地址');
            return;
          }

          if (!validateEmail(email)) {
            showError('请输入有效的邮箱地址');
            return;
          }

          if (!verificationCode || verificationCode.length !== 6) {
            showError('请输入6位验证码');
            return;
          }

          loginData = { email, verification_code: verificationCode };
        }

        const response = await fetch('/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(loginData)
        });

        const result = await response.json();

        if (result.success) {
          // 保存token到localStorage
          localStorage.setItem('auth_token', result.token);

          // 保存用户信息到localStorage
          const userInfo = {
            user_id: result.user_id,
            username: result.username,
            is_admin: result.is_admin
          };
          localStorage.setItem('user_info', JSON.stringify(userInfo));

          // 检查是否有重定向URL
          const redirectUrl = localStorage.getItem('redirectAfterLogin');
          if (redirectUrl) {
            // 清除重定向URL
            localStorage.removeItem('redirectAfterLogin');
            // 跳转到原来的页面
            window.location.href = redirectUrl;
          } else {
            // 默认跳转到管理页面
            window.location.href = '/admin';
          }
        } else {
          showError(result.message);
        }
      } catch (error) {
        showError('登录失败，请检查网络连接');
      } finally {
        setLoading(false);
      }
    });
    
    // 检查是否已经登录
    const token = localStorage.getItem('auth_token');
    if (token) {
      // 验证token是否有效
      fetch('/verify', {
        headers: {
          'Authorization': `Bearer ${token}`
        }
      })
      .then(response => response.json())
      .then(result => {
        if (result.authenticated) {
          window.location.href = '/admin';
        }
      })
      .catch(() => {
        // token无效，清除
        localStorage.removeItem('auth_token');
      });
    }

    // 登录方式切换相关变量
    let countdownTimer = null;
    let countdownSeconds = 0;

    // 登录方式切换
    function switchLoginType() {
      const loginType = document.querySelector('input[name="loginType"]:checked').value;

      // 隐藏所有表单
      document.querySelectorAll('.login-form-section').forEach(section => {
        section.style.display = 'none';
      });

      // 显示对应表单
      if (loginType === 'username') {
        document.getElementById('usernameLoginForm').style.display = 'block';
      } else if (loginType === 'email-password') {
        document.getElementById('emailPasswordLoginForm').style.display = 'block';
      } else if (loginType === 'email-code') {
        document.getElementById('emailCodeLoginForm').style.display = 'block';
        updateSendCodeButton();
      }

      hideError();
    }

    // 更新发送验证码按钮状态
    function updateSendCodeButton() {
      const sendCodeBtn = document.getElementById('sendCodeBtn');
      const email = document.getElementById('emailForCode').value.trim();
      const codeStatus = document.getElementById('codeStatus');

      if (email && validateEmail(email)) {
        sendCodeBtn.disabled = false;
        codeStatus.textContent = '可以发送邮箱验证码';
      } else {
        sendCodeBtn.disabled = true;
        if (!email) {
          codeStatus.textContent = '请先输入邮箱地址';
        } else if (!validateEmail(email)) {
          codeStatus.textContent = '请输入有效的邮箱地址';
        }
      }
    }

    // 邮箱格式验证
    function validateEmail(email) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return emailRegex.test(email);
    }

    // 开始倒计时
    function startCountdown() {
      countdownSeconds = 60;
      const sendCodeBtn = document.getElementById('sendCodeBtn');
      const codeStatus = document.getElementById('codeStatus');

      sendCodeBtn.disabled = true;

      countdownTimer = setInterval(() => {
        countdownSeconds--;
        sendCodeBtn.textContent = `重新发送 (${countdownSeconds}s)`;
        codeStatus.innerHTML = `<span class="countdown">验证码已发送，${countdownSeconds}秒后可重新发送</span>`;

        if (countdownSeconds <= 0) {
          clearInterval(countdownTimer);
          sendCodeBtn.disabled = false;
          sendCodeBtn.textContent = '发送验证码';
          codeStatus.textContent = '可以重新发送验证码';
        }
      }, 1000);
    }

    // 发送邮箱验证码
    async function sendVerificationCode() {
      const email = document.getElementById('emailForCode').value.trim();

      if (!email) {
        showError('请先输入邮箱地址');
        return;
      }

      if (!validateEmail(email)) {
        showError('请输入有效的邮箱地址');
        return;
      }

      try {
        const response = await fetch('/send-verification-code', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: email,
            type: 'login',
          })
        });

        const result = await response.json();

        if (result.success) {
          startCountdown();
        } else {
          showError(result.message);
        }
      } catch (error) {
        console.error('发送验证码失败:', error);
        showError('发送验证码失败，请检查网络连接');
      }
    }

    // 检查注册状态
    async function checkRegistrationStatus() {
      try {
        const response = await fetch('/registration-status');
        if (response.ok) {
          const data = await response.json();
          const registerSection = document.getElementById('registerSection');
          if (registerSection) {
            registerSection.style.display = data.enabled ? 'block' : 'none';
          }
        }
      } catch (error) {
        console.error('检查注册状态失败:', error);
        // 出错时默认显示注册链接
      }
    }

    // 检查默认登录信息显示状态
    async function checkLoginInfoStatus() {
      try {
        const response = await fetch('/login-info-status');
        const result = await response.json();

        const defaultLoginInfo = document.getElementById('defaultLoginInfo');
        if (result.enabled) {
          defaultLoginInfo.style.display = 'block';
        } else {
          defaultLoginInfo.style.display = 'none';
        }
      } catch (error) {
        console.error('检查登录信息显示状态失败:', error);
        // 出错时默认显示
        document.getElementById('defaultLoginInfo').style.display = 'block';
      }
    }

    // 事件监听器
    document.addEventListener('DOMContentLoaded', async function() {
      // 检查注册状态
      checkRegistrationStatus();

      // 检查默认登录信息显示状态
      checkLoginInfoStatus();

      // 登录方式切换
      document.querySelectorAll('input[name="loginType"]').forEach(radio => {
        radio.addEventListener('change', switchLoginType);
      });

      // 邮箱输入框事件
      const emailForCodeInput = document.getElementById('emailForCode');
      if (emailForCodeInput) {
        emailForCodeInput.addEventListener('input', updateSendCodeButton);
        updateSendCodeButton();
      }
    });
  </script>
</body>
</html>
